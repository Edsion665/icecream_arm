# Copy to config.yaml and adjust. Paths relative to cwd when starting.

bridge_base_url: "http://127.0.0.1:8775"
ingest_host: "0.0.0.0"
ingest_port: 8776
# Optional TCP JSON lines (camera2head §2.1); set null to disable
ingest_tcp_port: null

# 树莓派 pi2head（doc/pi2head.md）：收到 start 后才进入 FSM
pi2head_host: "0.0.0.0"
pi2head_tcp_port: 8778
idle_axes_rel_deg: [0.0, 0.0, 0.0, 0.0]
idle_bridge_hz: 2.0
idle_claw_wrist_deg: 0.0
idle_grip_state: 0

merge_pos_eps_m: 0.005
merge_yaw_eps_deg: 3.0
# 观测：连续 N 帧位置/腕角相近后才写入 target/object 槽（默认 3）
observe_stable_frames: 3
# 可选：观测稳定性阈值；省略则沿用 merge_pos_eps_m / merge_yaw_eps_deg
# observe_stable_pos_eps_m: 0.008
# observe_stable_yaw_eps_deg: 5.0
# 目标队列排序参考点 (robot_base, m)；距此点越近，step2 队首优先级越高
plan_reference_xyz: [0.0, 0.0, 0.0]
target_z_offset_m: 0.4
object_z_offset_m: 0.2

observe1_axes_rel_deg: [0.0, 0.0, -45.0, -60.0]
observe2_axes_rel_deg: [0.0, 5.0, -30.0, -50.0]
# obs2 传送带：探视野秒数；物体中心水平距 robot_base (0,0) 超过该值（米）则开带直至进入区
conveyor_obs2_probe_s: 5.0
conveyor_object_max_xy_m: 0.6

state_timeout_s: 60.0
refresh_wait_s: 2.0

# Optional: PLAN must see object with confidence >= this (0 = off)
min_object_confidence: 0.0

# --- v3 FSM ---
# null 或省略：在 obs1/obs2 一直等到帧内出现 target/object（推荐联调，避免超时后整轮重跑来回摆）
# 正数：有限超时（秒）；超时抛错后 run_forever 会重跑整轮 → 易表现为 obs1/obs2 反复运动
camera_wait_timeout_s: null
# Step 7 pick / step 11 place (bridge grip_state)
claw_closed_for_pick: true
claw_open_for_place: true
# 夹紧/松开指令成功后，再等待若干秒再执行后续关节运动（秒；设为 0 可关闭）
claw_settle_after_pick_s: 2.0
claw_settle_after_place_s: 2.0
# 抓取/放置后：先上抬（米，默认 10cm）→ 转腕 → 关节回观测位
retreat_lift_m: 0.1
# obs1/obs2 到位后 claw 腕角（仅观测阶段 step1/step3，与抓取/放置补偿无关）
claw_after_joints_wrist_deg: 0.0
obs2_entry_wrist_deg: 0.0
# 抓取/放置 claw：wrist_cmd = wrist_cam − (J1(x,y) − observe*_axes_rel_deg[0])，J1 与 bridge IK 一致
# Extra claw POST on every micro-transition (joints/pose/plan boundaries)
emit_claw_on_every_transition: false
# BridgeClient initial grip: true=张开 → 下发 grip_state=1；false=合拢 → grip_state=0
initial_grip_open: true
# 每次 obs1 / obs2 / 抓取后回 obs1 的关节到位后清空相机缓存帧；wait 必须收到**新** ingest 才继续（避免上一轮 _last_frame 让 step2 与 step3 同一时刻触发）
require_fresh_detection_after_obs: true
